name: Build & Release KCA Theme

on:
  push:
    tags:
      - 'kca-*'
      - 'kca-v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SRC_DIR: themes/krishna-consciousness-academy
      DEMO_DIR: demo/krishna-consciousness-academy
      TARGET_REPO: pavel-pasechnik/krishna-consciousness-academy
      GH_PAT: ${{ secrets.TARGET_REPO_TOKEN }}

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version from style.css
        id: version
        run: |
          FILE="$SRC_DIR/style.css"
          VERSION=$(grep -i '^Version:' "$FILE" | cut -d ':' -f 2 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build archive
        id: build
        run: |
          mkdir -p dist
          ZIP_NAME="krishna-consciousness-academy-${{ steps.version.outputs.version }}.zip"
          (cd "$SRC_DIR" && zip -r "../../dist/$ZIP_NAME" .)
          echo "zip=dist/$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Copy demo files
        run: |
          mkdir -p dist
          cp -r $DEMO_DIR/* dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.zip }}
            dist/**
          token: ${{ secrets.TARGET_REPO_TOKEN }}

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ env.GH_PAT }}
          path: target
          ref: main

      - name: Push release content into target repo root
        run: |
          set -e
          TARGET_DIR=$GITHUB_WORKSPACE/target
          RELEASE_DIR=$GITHUB_WORKSPACE/dist

          # Синхронизация: архив + демо → корень target
          rsync -a --delete "$RELEASE_DIR/" "$TARGET_DIR/"

          cd "$TARGET_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ steps.version.outputs.version }}: publish to main"
          git push origin main
